# Runs The Watch Wire engine on GitHub's servers, so the laptop can stay closed.
# News scan, every hour: look for watch news only; if worth posting, make a topical post (breaking ones go out at once).
# Publisher, every 15 min: post approved posts whose time has come (no scan, no AI).
# Content maker, nightly: plan (20:00 NY) and make (21:00 NY) the scheduled posts; rejected posts are remade right away.
# 20:00 New York: plan tomorrow's posts. 21:00 New York: make and approve them.
name: Watch Wire engine

on:
  schedule:
    - cron: "0 * * * *"      # news scan
    - cron: "*/15 * * * *"   # publisher
    - cron: "30 6 * * *"     # plan  (01:30 New York, winter time; overnight to spare daytime usage)
    - cron: "0 7 * * *"      # make-ideas (02:00 New York, winter time)
    - cron: "40 8 * * *"     # make-ideas backup (03:40 New York): plans + makes if the earlier runs were skipped; no-op otherwise
    - cron: "0 8 * * 0"      # tidy (Sunday 03:00 New York): condense lessons, cost report
  workflow_dispatch:
    inputs:
      command:
        description: "tick, plan, make-ideas, publish-due, status, scout, insights, or plan-now"
        default: "tick"
      slots:
        description: 'for plan-now: "19:05 NEWS,20:05 CELEBRITY"'
        default: ""

permissions:
  contents: write

# Three lanes that never block each other: the publisher (every 15 min), the news scan (hourly)
# and the content maker (plan / make-ideas / manual runs).
concurrency:
  group: ${{ (github.event.schedule == '*/15 * * * *' || github.event.inputs.command == 'publish-due') && 'publisher' || (github.event.schedule == '0 * * * *' || github.event.inputs.command == 'tick') && 'scan' || 'maker' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TZ: America/New_York
      CHROME: google-chrome
      GRAPH_HOST: graph.facebook.com
      GRAPH_VERSION: v21.0
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      WW_SLIDES_REPO: ${{ github.repository }}
      PUBLIC_UPLOAD_CMD: sh ${{ github.workspace }}/watch-wire-engine/src/upload-github.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick the command
        run: |
          case "${{ github.event.schedule }}" in
            "30 6 * * *") echo "CMD=plan" >> "$GITHUB_ENV" ;;
            "0 7 * * *"|"40 8 * * *") echo "CMD=make-ideas" >> "$GITHUB_ENV" ;;
            "0 8 * * 0") echo "CMD=tidy" >> "$GITHUB_ENV" ;;
            "*/15 * * * *") echo "CMD=publish-due" >> "$GITHUB_ENV" ;;
            *) echo "CMD=${{ github.event.inputs.command || 'tick' }}" >> "$GITHUB_ENV" ;;
          esac
      - name: Install tools
        run: |
          (command -v convert >/dev/null && command -v ffmpeg >/dev/null) || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick ffmpeg)
          npm install -g @anthropic-ai/claude-code >/dev/null
      - name: Cache the person cut-out library
        if: env.CMD != 'publish-due'
        uses: actions/cache@v4
        with:
          path: watch-wire-engine/node_modules
          key: ww-modules-${{ hashFiles('watch-wire-engine/package.json') }}
      - name: Install the person cut-out library
        if: env.CMD != 'publish-due'
        working-directory: watch-wire-engine
        run: test -d node_modules/@imgly || npm install --no-audit --no-fund --silent || echo "cut-out library unavailable; covers fall back to plain photos"
      - name: Run the engine
        working-directory: watch-wire-engine
        run: node src/run.js "$CMD"
        env:
          WW_SLOTS: ${{ github.event.inputs.slots }}
      - name: Save the queue and posts back to the repo
        if: always()
        run: bash watch-wire-engine/src/save.sh
